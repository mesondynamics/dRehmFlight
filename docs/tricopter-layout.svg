<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
<defs>
  <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1679aa"/></marker>
  <marker id="amberArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c2780d"/></marker>
  <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#34546c"/></marker>
</defs>
<rect width="1440" height="1100" fill="#f4f7fa"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#203447">
  <text x="54" y="62" font-size="32" font-weight="bold">三旋翼布局 · M2 / M4 / M3</text>
  <text x="54" y="101" font-size="20" fill="#526a7d">俯视：从上向下看；机头朝上。电机位置已按你的更正确认，转向为建议方案，待实物核对。</text>
  <rect x="34" y="128" width="890" height="792" rx="20" fill="white" stroke="#dce5eb"/>
  <rect x="946" y="128" width="460" height="792" rx="20" fill="white" stroke="#dce5eb"/>

  <!-- Equilateral arms: front pair at +/-60 degrees, rear at 180 degrees. -->
  <g stroke="#8094a6" stroke-width="20" stroke-linecap="round">
    <path d="M478 487L230 344"/><path d="M478 487L726 344"/><path d="M478 487L478 773"/>
  </g>
  <g fill="none" stroke="#c5d4dd" stroke-width="2" stroke-dasharray="8 8">
    <circle cx="478" cy="487" r="286"/>
    <path d="M478 174V860"/>
  </g>
  <text x="478" y="174" font-size="25" text-anchor="middle" font-weight="bold">机头 / IMU +X</text>
  <path d="M478 424V206" stroke="#34546c" stroke-width="4" marker-end="url(#axisArrow)"/>
  <path d="M433 487H305" stroke="#34546c" stroke-width="3" marker-end="url(#axisArrow)"/>
  <text x="302" y="522" font-size="19">+Y 左</text>
  <rect x="427" y="439" width="102" height="96" rx="12" fill="#eaf2f8" stroke="#34546c" stroke-width="2"/>
  <text x="478" y="470" text-anchor="middle" font-size="22" font-weight="bold">IMU</text>
  <text x="478" y="499" text-anchor="middle" font-size="18">+Z 朝上 ⊙</text>
  <text x="478" y="526" text-anchor="middle" font-size="16">重心附近</text>
  <text x="478" y="583" text-anchor="middle" font-size="20">中心舵机：Teensy 引脚 6</text>
  <text x="478" y="614" text-anchor="middle" font-size="18" fill="#526a7d">同时倾转三根机臂</text>

  <!-- Motor 2: CCW viewed from above. -->
  <circle cx="230" cy="344" r="83" fill="#eaf8f2" stroke="#459a7a" stroke-width="2"/>
  <path d="M201 326Q223 310 259 362Q237 378 201 326" fill="#a2d9c3"/>
  <circle cx="230" cy="344" r="16" fill="#459a7a"/>
  <path d="M307 344 A77 77 0 1 0 230 421" fill="none" stroke="#1679aa" stroke-width="5"/>
  <path d="M242 421L225 412L225 430Z" fill="#1679aa"/>
  <text x="230" y="224" font-size="29" font-weight="bold" text-anchor="middle">M2 · 左前</text>
  <text x="230" y="254" font-size="21" text-anchor="middle">引脚 1 → 电调 IN2</text>
  <text x="230" y="466" font-size="22" text-anchor="middle" fill="#1679aa">CCW 逆时针 / 正桨*</text>

  <!-- Motor 4: CW viewed from above. -->
  <circle cx="726" cy="344" r="83" fill="#fff0ed" stroke="#cd836b" stroke-width="2"/>
  <path d="M697 362Q719 378 755 326Q733 310 697 362" fill="#e9b09d"/>
  <circle cx="726" cy="344" r="16" fill="#cd836b"/>
  <path d="M649 344 A77 77 0 1 1 726 421" fill="none" stroke="#1679aa" stroke-width="5"/>
  <path d="M714 421L731 412L731 430Z" fill="#1679aa"/>
  <text x="726" y="224" font-size="29" font-weight="bold" text-anchor="middle">M4 · 右前</text>
  <text x="726" y="254" font-size="21" text-anchor="middle">引脚 3 → 电调 IN4</text>
  <text x="726" y="466" font-size="22" text-anchor="middle" fill="#1679aa">CW 顺时针 / 反桨*</text>

  <!-- Motor 3: CCW viewed from above. -->
  <circle cx="478" cy="773" r="83" fill="#eaf8f2" stroke="#459a7a" stroke-width="2"/>
  <path d="M449 755Q471 739 507 791Q485 807 449 755" fill="#a2d9c3"/>
  <circle cx="478" cy="773" r="16" fill="#459a7a"/>
  <path d="M555 773 A77 77 0 1 0 478 850" fill="none" stroke="#1679aa" stroke-width="5"/>
  <path d="M490 850L473 841L473 859Z" fill="#1679aa"/>
  <text x="269" y="758" font-size="27" font-weight="bold" text-anchor="middle">M3 · 正后</text>
  <text x="269" y="790" font-size="20" text-anchor="middle">引脚 2 → 电调 IN3</text>
  <text x="478" y="893" font-size="22" text-anchor="middle" fill="#1679aa">CCW 逆时针 / 正桨*</text>

  <!-- Required horizontal thrust directions for positive (left/CCW) body yaw. -->
  <g fill="none" stroke="#c2780d" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#amberArrow)">
    <path d="M230 344L177 436"/>
    <path d="M726 344L684 271"/>
    <path d="M478 773L600 773"/>
  </g>

  <text x="974" y="176" font-size="25" font-weight="bold">安装与接线核对</text>
  <text x="974" y="221" font-size="21">顺时针绕机体：</text>
  <text x="974" y="255" font-size="24" font-weight="bold">M2 → M4 → M3 → M2</text>
  <text x="974" y="300" font-size="21">三臂夹角约 120°，+X 朝前方夹角。</text>
  <path d="M974 324H1377" stroke="#dce5eb"/>
  <text x="974" y="365" font-size="22" font-weight="bold">电机自转 / 螺旋桨</text>
  <text x="974" y="405" font-size="20">蓝色实线箭头：电机自转方向。</text>
  <text x="974" y="440" font-size="20">M2、M3：CCW 逆时针桨。</text>
  <text x="974" y="475" font-size="20">M4：CW 顺时针桨。</text>
  <text x="974" y="510" font-size="19">*本图约定：正桨=CCW，反桨=CW。</text>
  <text x="974" y="543" font-size="18" fill="#526a7d">商家命名可能相反，以 CW/CCW 为准。</text>
  <text x="974" y="578" font-size="20">三片桨均向下吹风，机体获得升力。</text>
  <path d="M974 607H1377" stroke="#dce5eb"/>
  <text x="974" y="647" font-size="22" font-weight="bold">倾转与偏航</text>
  <text x="974" y="686" font-size="19" fill="#a1620d">橙色虚线箭头：左偏航所需水平推力。</text>
  <text x="974" y="722" font-size="19">+GyroZ = 左偏航 = 机体俯视逆时针。</text>
  <text x="974" y="757" font-size="19">例如 M3 向机体右侧倾，产生左偏航。</text>
  <text x="974" y="792" font-size="19">舵机正反须验证齿轮实际运动方向。</text>
  <text x="974" y="842" font-size="20" font-weight="bold">输出：OneShot125 / 舵机 50 Hz PWM</text>
  <text x="974" y="877" font-size="18" fill="#526a7d">IN1 不使用；Teensy 与电调/BEC 共地。</text>

  <rect x="34" y="944" width="1372" height="124" rx="16" fill="#eaf0f5"/>
  <text x="58" y="978" font-size="20" font-weight="bold">此图是安装建议，尚未测得实物电机转向或桨叶型号。</text>
  <text x="58" y="1012" font-size="19">拆桨验证：右侧下压 → M4 增速；左侧下压 → M2 增速；机头下压 → M2、M4 增速；机尾下压 → M3 增速。</text>
  <text x="58" y="1045" font-size="18" fill="#526a7d">RuiBet IN2/IN3/IN4 是控制输入，不是电池电源或三相电机焊盘。图示桨叶仅表示旋向，不用于判断叶片外形。</text>
</g>
</svg>
